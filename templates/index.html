<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DocAssistant</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen">
  <div class="max-w-4xl mx-auto p-4">
    <header class="mb-6">
      <h1 class="text-2xl font-bold text-gray-900">DocAssistant</h1>
      <p class="text-gray-500 text-sm">Upload a PDF and ask questions with AI</p>
    </header>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
      <section class="bg-white rounded-lg p-6 shadow">
        <h2 class="font-semibold text-gray-800 mb-3">Upload Document</h2>
        <div id="drop-zone" class="border-2 border-dashed border-gray-300 rounded-lg p-8 text-center cursor-pointer hover:border-blue-400">
          <p class="text-gray-400">Drop a PDF here or click to upload</p>
          <input type="file" id="file-input" accept=".pdf" class="hidden" />
        </div>
        <div id="status" class="mt-3 text-sm text-gray-500"></div>
      </section>

      <section class="bg-white rounded-lg p-6 shadow">
        <h2 class="font-semibold text-gray-800 mb-3">Ask Questions</h2>
        <div id="no-doc" class="text-sm text-gray-400 py-8 text-center">Upload a document first</div>
        <div id="query-area" class="hidden">
          <form id="query-form" class="flex gap-2">
            <input id="query-input" class="flex-1 border rounded-lg px-4 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Ask a question..." />
            <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded-lg text-sm hover:bg-blue-700">Ask</button>
          </form>
          <div id="answer" class="mt-4"></div>
        </div>
      </section>
    </div>
  </div>

  <script>
    let activeDoc = null;

    const dropZone = document.getElementById("drop-zone");
    const fileInput = document.getElementById("file-input");
    const statusEl = document.getElementById("status");
    const noDocEl = document.getElementById("no-doc");
    const queryArea = document.getElementById("query-area");
    const queryForm = document.getElementById("query-form");
    const queryInput = document.getElementById("query-input");
    const answerEl = document.getElementById("answer");

    dropZone.addEventListener("click", () => fileInput.click());
    dropZone.addEventListener("dragover", (e) => { e.preventDefault(); dropZone.classList.add("border-blue-500"); });
    dropZone.addEventListener("dragleave", () => dropZone.classList.remove("border-blue-500"));
    dropZone.addEventListener("drop", (e) => { e.preventDefault(); dropZone.classList.remove("border-blue-500"); if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]); });
    fileInput.addEventListener("change", () => { if (fileInput.files.length) handleFile(fileInput.files[0]); });

    async function handleFile(file) {
      statusEl.textContent = "Uploading...";
      const formData = new FormData();
      formData.append("file", file);

      try {
        const upRes = await fetch("/api/upload", { method: "POST", body: formData });
        const up = await upRes.json();
        if (!up.success) { statusEl.textContent = "Upload failed"; return; }

        statusEl.textContent = "Indexing...";
        const idxRes = await fetch(`/api/index?doc_id=${up.doc_id}&filename=${encodeURIComponent(up.filename)}`, { method: "POST" });
        const idx = await idxRes.json();

        activeDoc = { docId: up.doc_id, filename: up.filename };
        statusEl.textContent = `Indexed ${idx.chunks_count} chunks from ${up.filename}`;
        noDocEl.classList.add("hidden");
        queryArea.classList.remove("hidden");
        queryInput.focus();
      } catch {
        statusEl.textContent = "Error uploading file";
      }
    }

    queryForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const question = queryInput.value.trim();
      if (!question || !activeDoc) return;

      answerEl.innerHTML = '<p class="text-gray-400 text-sm">Thinking...</p>';
      queryInput.disabled = true;

      try {
        const res = await fetch("/api/query", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ doc_id: activeDoc.docId, question, top_k: 5 }),
        });
        const data = await res.json();

        let html = `<div class="bg-blue-50 rounded p-3 text-sm text-gray-800 whitespace-pre-wrap">${data.answer}</div>`;
        if (data.sources?.length) {
          html += '<div class="mt-2 text-xs text-gray-400">Sources:</div>';
          data.sources.forEach(s => {
            html += `<div class="text-xs text-gray-500">${s.filename}#page:${s.page}</div>`;
          });
        }
        answerEl.innerHTML = html;
      } catch {
        answerEl.innerHTML = '<p class="text-red-500 text-sm">Query failed</p>';
      } finally {
        queryInput.disabled = false;
        queryInput.value = "";
        queryInput.focus();
      }
    });
  </script>
</body>
</html>
